<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#263238">
<title>جیبمون</title>

<style>
*{box-sizing:border-box}
body{
margin:0;
background:#f3f5f6;
color:#263238;
font-family:Tahoma,Arial,sans-serif
}
.app{
max-width:520px;
margin:auto;
min-height:100vh;
background:#fff;
padding-bottom:90px
}
header{
background:#263238;
color:#fff;
padding:24px 18px 28px;
border-radius:0 0 25px 25px
}
.logo{font-size:28px;font-weight:bold}
.sub{font-size:12px;opacity:.7;margin-top:6px}
.balance{
margin-top:20px;
background:#ffffff12;
padding:18px;
border-radius:17px
}
.balance span{font-size:12px;opacity:.75}
.balance strong{
display:block;
font-size:27px;
margin-top:7px
}
.cards{
display:grid;
grid-template-columns:1fr 1fr;
gap:12px;
padding:17px
}
.card{
background:#fff;
border:1px solid #e4e8ea;
border-radius:17px;
padding:16px;
box-shadow:0 5px 18px #00000008
}
.label{font-size:12px;color:#777}
.value{font-size:17px;font-weight:bold;margin-top:8px}
.income{color:#16834d}
.expense{color:#c7354d}
.section{padding:0 17px}
.title{font-size:18px;font-weight:bold;margin:12px 0}
.page{display:none}
.page.active{display:block}
.input,select{
width:100%;
padding:13px;
border:1px solid #dce1e3;
border-radius:12px;
font-size:14px;
margin:5px 0 12px;
background:#fff
}
.primary,.secondary,.danger{
width:100%;
padding:14px;
border:0;
border-radius:13px;
font-size:14px;
font-weight:bold
}
.primary{background:#263238;color:#fff}
.secondary{background:#eceff1;color:#263238;margin-bottom:12px}
.danger{background:#ffebee;color:#c62828;margin-top:15px}
.notice{
margin:15px 17px;
padding:12px;
background:#f1f4f5;
border-radius:13px;
font-size:12px;
line-height:1.8;
color:#607078
}
.transaction{
display:flex;
justify-content:space-between;
align-items:center;
padding:13px 0;
border-bottom:1px solid #eee
}
.transaction:last-child{border-bottom:0}
.transaction small{color:#888}
.empty
