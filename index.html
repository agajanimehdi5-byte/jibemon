<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#5b4bdb">
<title>جیبمون</title>
<style>
*{box-sizing:border-box;font-family:Tahoma,Arial,sans-serif}
body{margin:0;background:#f5f6fa;color:#222}
.app{max-width:520px;margin:auto;min-height:100vh;background:#fff;padding-bottom:90px}
header{background:linear-gradient(135deg,#5b4bdb,#806cf0);color:white;padding:24px 18px;border-radius:0 0 28px 28px}
.logo{font-size:26px;font-weight:bold}
.subtitle{font-size:12px;margin-top:5px;opacity:.85}
.balanceBox{margin-top:18px;background:#ffffff20;padding:17px;border-radius:18px}
.balance{font-size:28px;font-weight:bold;margin-top:6px}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:17px}
.card{background:white;border:1px solid #eee;border-radius:18px;padding:15px;box-shadow:0 5px 18px #00000009}
.title{font-size:12px;color:#777}.number{font-size:17px;font-weight:bold;margin-top:8px}
.income{color:#159447}.expense{color:#d83b52}
.section{padding:0 17px}.sectionTitle{font-size:18px;font-weight:bold;margin:12px 0}
.page{display:none}.active{display:block}
.input,select{width:100%;padding:13px;margin:6px 0 12px;border:1px solid #ddd;border-radius:12px;font-size:14px}
.primary,.voice,.danger{width:100%;padding:14px;border:0;border-radius:13px;font-size:14px;font-weight:bold}
.primary{background:#5b4bdb;color:#fff}.voice{background:#eeeaff;color:#5b4bdb;margin-bottom:12px}
.danger{background:#ffe9ed;color:#c62f48;margin-top:15px}
.fab{position:fixed;bottom:76px;left:50%;transform:translateX(-50%);width:60px;height:60px;border:0;border-radius:50%;background:#5b4bdb;color:#fff;font-size:30px;z-index:20}
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:520px;height:70px;background:#fff;border-top:1px solid #eee;display:flex;justify-content:space-around;align-items:center;z-index:19}
.nav button{border:0;background:none;color:#777;font-size:11px}
.nav button span{display:block;font-size:21px;margin-bottom:3px}
.nav button.activeNav{color:#5b4bdb;font-weight:bold}
.transaction{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid #eee}
.empty{text-align:center;color:#888;padding:25px}
.member{display:flex;align-items:center;gap:10px;padding:13px 0;border-bottom:1px solid #eee}
.avatar{width:42px;height:42px;border-radius:50%;background:#eeeaff;display:grid;place-items:center}
.bubble{padding:11px 13px;border-radius:15px;margin:8px 0;font-size:13px}
.bot{background:#eeeaff}.me{background:#eee}
.notice{background:#fff8df;color:#765d00;padding:11px;border-radius:13px;font-size:12px;margin:15px 17px}
</style>
</head>

<body>

<div class="app">

<header>
<div class="logo">جیبمون 💜</div>
<div class="subtitle">مدیریت مالی خودت و خانواده‌ات</div>
<div class="balanceBox">
<div>موجودی کل</div>
<div class="balance" id="balance">۰ تومان</div>
</div>
</header>

<div id="home" class="page active">

<div class="cards">
<div class="card">
<div class="title">درآمد</div>
<div class="number income" id="income">۰ تومان</div>
</div>

<div class="card">
<div class="title">هزینه</div>
<div class="number expense" id="expense">۰ تومان</div>
</div>
</div>

<div class="notice">
🎙️ می‌توانی دخل و خرج را با صدا یا متن ثبت کنی.
</div>

<div class="section">
<div class="sectionTitle">آخرین تراکنش‌ها</div>
<div class="card" id="transactions"></div>
</div>

</div>


<div id="add" class="page">

<div class="section">
<div class="sectionTitle">ثبت دخل و خرج</div>

<button class="voice" onclick="voiceInput()">🎙️ ثبت با صدا</button>

<label>شرح</label>
<input class="input" id="desc" placeholder="مثلاً خرید خانه">

<label>مبلغ</label>
<input class="input" id="amount" type="number" placeholder="مبلغ به تومان">
